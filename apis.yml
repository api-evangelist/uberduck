aid: uberduck
url: https://raw.githubusercontent.com/api-evangelist/uberduck/refs/heads/main/apis.yml
name: Uberduck
kind: company
description: >-
  Uberduck is an AI voice platform whose public REST API converts text into
  natural-sounding speech across a catalog of voices and provider-backed models
  (AWS Polly, Google Cloud, Azure), lists and filters those voices, creates
  instant zero-shot voice clones from reference audio, and mints LiveKit tokens
  for real-time conversational AI voice calls. The API is HTTPS request/response
  with Bearer API-key authentication. It is self-serve but gated behind a paid
  plan - API access is a feature of the Creator plan and above. Uberduck's
  earlier AI music / rap-vocals API surface is no longer part of the published
  API; the current documented product (OpenAPI version 0.1.0) is focused on
  text-to-speech, voices, and conversational voice.
