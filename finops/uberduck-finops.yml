meters:
- name: subscription
  description: Recurring plan fee (Starter, Creator, Pro) granting a monthly credit allowance.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: credits_consumed
  description: Credits drawn down by text-to-speech, voice cloning, and conversational-token usage.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: characters_synthesized
  description: Characters of text submitted to the text-to-speech endpoint (up to 10,000 per request).
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - voice
  - model
principles:
- name: Visibility
  description: Track monthly credit consumption per endpoint (text-to-speech vs voice cloning vs conversational) against the plan allowance.
- name: Allocation
  description: Map API keys and voices/models to teams or products so credit burn is attributable to a workload.
- name: Optimization
  description: Right-size the plan to actual credit usage; trim text length, cache generated audio_url outputs, and reuse cloned voices rather than re-cloning to conserve credits.
- name: Accountability
  description: Assign an owner per subscription; review monthly credit burn versus the plan allowance and upgrade/downgrade tiers accordingly.
