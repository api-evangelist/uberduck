description: >-
  FinOps view of Uberduck spend. Uberduck is billed as a fixed monthly (or
  discounted yearly) subscription that grants a bounded allowance of credits;
  text-to-speech generation, instant voice cloning, and conversational-token
  calls consume those credits. Cost is therefore driven by which plan you hold
  (Starter, Creator, Pro, or Enterprise) and how much of the monthly credit
  allowance you burn. API access is only available on Creator and above, so the
  minimum spend to use the API programmatically is the Creator subscription.
notes: >-
  Uberduck does not publish per-credit unit economics for overage on the public
  pricing page; spend is effectively capped by the plan's monthly credit
  allowance and resets each cycle. Re-verify plan prices, credit counts, and any
  overage/top-up mechanics during reconciliation. Prices captured 2026-07-11.
