specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Uberduck
providerId: uberduck
created: '2026-07-11'
modified: '2026-07-11'
reconciled: false
tags:
- AI
- Text to Speech
- Voice
- Rate Limiting
- Quotas
description: >-
  Uberduck documents tiered rate limits keyed to the subscription plan, plus a
  hard per-request character cap. Free-tier keys are limited to roughly 5
  requests per minute and 100 per day; Pro raises this to about 60 per minute
  and 1,000 per day; Enterprise limits are custom. Each request accepts up to
  10,000 characters of text on lower tiers (documented as up to 20,000 on Pro).
  Exceeding a limit returns HTTP 429 Too Many Requests, and every response
  carries X-RateLimit-Limit, X-RateLimit-Remaining, and X-RateLimit-Reset
  headers; 429 bodies include reset_at and retry_after.
notes: >-
  Numbers captured 2026-07-11 from https://docs.uberduck.ai/api-reference/rate-limits.
  The documented rate-limit tiers ("Free/Pro/Enterprise") are expressed in the
  rate-limit page's own terms and do not map one-to-one to the pricing page's
  Starter/Creator/Pro plan names; treat the request-rate tiers and the billing
  plans as separate axes and re-verify during reconciliation. Note the OpenAPI
  TextToSpeechRequest caps text at 10,000 characters (maxLength).
sources:
- https://docs.uberduck.ai/api-reference/rate-limits
- https://api.uberduck.ai/openapi.json
- https://docs.uberduck.ai/guides/getting-started
responseCodes:
  throttled: 429
headers:
- X-RateLimit-Limit
- X-RateLimit-Remaining
- X-RateLimit-Reset
limits:
- name: Free Tier Requests Per Minute
  scope: account
  metric: requests
  limit: 5 per minute
  notes: Documented free-tier per-minute request ceiling.
- name: Free Tier Requests Per Day
  scope: account
  metric: requests
  limit: 100 per day
  notes: Documented free-tier per-day request ceiling.
- name: Pro Tier Requests Per Minute
  scope: account
  metric: requests
  limit: 60 per minute
  notes: Documented Pro-tier per-minute request ceiling.
- name: Pro Tier Requests Per Day
  scope: account
  metric: requests
  limit: 1000 per day
  notes: Documented Pro-tier per-day request ceiling.
- name: Enterprise Requests
  scope: account
  metric: requests
  limit: custom
  notes: Enterprise per-minute and per-day limits are negotiated.
- name: Characters Per Request
  scope: request
  metric: characters
  limit: 10000 (up to 20000 documented on Pro)
  notes: OpenAPI TextToSpeechRequest.text maxLength is 10000; rate-limit docs cite up to 20000 on Pro.
policies:
- name: Rate Limit Headers
  description: Every response includes X-RateLimit-Limit, X-RateLimit-Remaining, and X-RateLimit-Reset (Unix timestamp).
- name: 429 Handling
  description: On 429, the body includes details.reset_at (Unix timestamp) and details.retry_after (seconds); clients should back off until then.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor retry_after / X-RateLimit-Reset.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
